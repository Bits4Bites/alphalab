<div class="top-bar px-4 py-3 d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-semibold">{% block page_title %}{% endblock %}</h5>
    <div class="dropdown">
        <a href="#" class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle"
           data-bs-toggle="dropdown" aria-expanded="false">
            {% if user.avatar %}
            <img src="{{ user.avatar }}" alt="avatar" class="rounded-circle" width="32" height="32">
            {% else %}
            <div class="rounded-circle bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center"
                 style="width: 32px; height: 32px;">
                <i class="bi bi-person-fill text-secondary"></i>
            </div>
            {% endif %}
            <span class="text-muted small">{{ user.name }}</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
            <li>
                <a class="dropdown-item" href="/logout">
                    <i class="bi bi-box-arrow-left me-2"></i>Logout
                </a>
            </li>
        </ul>
    </div>
</div>
