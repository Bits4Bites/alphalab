<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AlphaLab{% endblock %}</title>
    <link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <style>
        body { min-height: 100vh; }
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: #1e293b;
            transition: width 0.2s ease;
        }
        .sidebar .nav-link {
            color: #94a3b8;
            padding: 10px 20px;
            font-size: 0.9rem;
            border-radius: 8px;
            margin: 2px 12px;
        }
        .sidebar .nav-link:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.05);
        }
        .sidebar .nav-link.active {
            color: #fff;
            background: rgba(99, 102, 241, 0.2);
        }
        .sidebar .nav-link i { width: 24px; }
        .sidebar-brand {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #f8fafc;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-brand .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-section {
            padding: 16px 20px 6px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
        }
        .content-area {
            flex: 1;
            background: #f1f5f9;
            min-height: 100vh;
        }
        .top-bar {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar d-flex flex-column">
            <a href="/dashboard" class="sidebar-brand">
                <img src="/static/img/logo.png" alt="AlphaLab" height="32" class="rounded">
                AlphaLab
            </a>

            <div class="sidebar-section">Main</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="/dashboard">
                        <i class="bi bi-grid me-2"></i>Dashboard
                    </a>
                </li>
            </ul>

            <div class="sidebar-section">Labs</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% block nav_analyze %}{% endblock %}" href="/analyze-ticker">
                        <i class="bi bi-search me-2"></i>Analyze Ticker
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_build %}{% endblock %}" href="#">
                        <i class="bi bi-pie-chart me-2"></i>Build Portfolio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% block nav_review %}{% endblock %}" href="#">
                        <i class="bi bi-clipboard-data me-2"></i>Review Portfolio
                    </a>
                </li>
            </ul>

            <div class="sidebar-section">Settings</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% block nav_ai_vendors %}{% endblock %}" href="/ai-vendors">
                        <i class="bi bi-cpu me-2"></i>AI Vendors
                    </a>
                </li>
            </ul>

            <div class="mt-auto">
                <ul class="nav flex-column mb-3">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">
                            <i class="bi bi-box-arrow-left me-2"></i>Sign Out
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <div class="content-area">
            {% include "partials/topbar.html" %}

            <!-- Page content -->
            <div class="p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
